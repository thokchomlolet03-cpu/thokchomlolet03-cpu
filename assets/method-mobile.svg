<svg xmlns="http://www.w3.org/2000/svg" width="600" height="320" viewBox="0 0 600 320" role="img" aria-labelledby="title"><title id="title">Build. Test. Understand.</title><style>@media(prefers-reduced-motion:reduce){.motion{display:none}}</style><rect width="600" height="320" rx="18" fill="#141917"/><text x="25" y="45" fill="#98a498" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" letter-spacing="2">THE WORKING METHOD</text><text x="25" y="107" fill="#d2f76b" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="600" >BUILD</text><text x="25" y="136" fill="#d6dbd0" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" >Make it concrete.</text><text x="25" y="191" fill="#d2f76b" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="600" >TEST</text><text x="25" y="220" fill="#d6dbd0" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" >Measure the result.</text><text x="25" y="275" fill="#d2f76b" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="600" >UNDERSTAND</text><text x="25" y="304" fill="#d6dbd0" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" >Explain the mechanism.</text></svg>