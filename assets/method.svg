<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="190" viewBox="0 0 1800 190" role="img" aria-labelledby="title"><title id="title">Build. Test. Understand. Make the idea concrete, measure what happens, and explain the mechanism.</title><style>@media(prefers-reduced-motion:reduce){.motion{display:none}}</style><rect width="1800" height="190" rx="16" fill="#141917"/><text x="46" y="51" fill="#98a498" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" letter-spacing="3">THE WORKING METHOD</text><text x="46" y="107" fill="#d2f76b" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="600" letter-spacing="-1">BUILD</text><text x="46" y="148" fill="#d6dbd0" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" >Make the idea concrete.</text><path d="M486 102 h70 m-12 -12 12 12 -12 12" fill="none" stroke="#73816e" stroke-width="2"/><text x="632" y="107" fill="#d2f76b" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="600" letter-spacing="-1">TEST</text><text x="632" y="148" fill="#d6dbd0" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" >Measure what actually happens.</text><path d="M1072 102 h70 m-12 -12 12 12 -12 12" fill="none" stroke="#73816e" stroke-width="2"/><text x="1218" y="107" fill="#d2f76b" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="600" letter-spacing="-1">UNDERSTAND</text><text x="1218" y="148" fill="#d6dbd0" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" >Explain the mechanism.</text></svg>