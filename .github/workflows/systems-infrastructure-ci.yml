name: Systems infrastructure - build and evidence checks

on:
  push:
    paths:
      - 'systems-infrastructure/**'
      - 'learning-hub/**'
      - 'README.md'
      - 'PROJECT_GUIDE.md'
      - '.github/ISSUE_TEMPLATE/notebooklm-link.yml'
      - '.github/workflows/systems-infrastructure-ci.yml'
  pull_request:
    paths:
      - 'systems-infrastructure/**'
      - 'learning-hub/**'
      - 'README.md'
      - 'PROJECT_GUIDE.md'
      - '.github/ISSUE_TEMPLATE/notebooklm-link.yml'
      - '.github/workflows/systems-infrastructure-ci.yml'

permissions:
  contents: read

jobs:
  linux-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install shell diagnostic tooling
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck iproute2 procps
      - name: Validate Bash syntax and lint
        run: |
          bash -n systems-infrastructure/projects/p01-linux-diagnostics/diagnose.sh
          shellcheck systems-infrastructure/projects/p01-linux-diagnostics/diagnose.sh
          shellcheck systems-infrastructure/projects/p01-linux-diagnostics/tests/smoke.sh
          shellcheck systems-infrastructure/projects/p01-linux-diagnostics/tests/failure_cases.sh
      - name: Run read-only smoke and failure-path tests
        run: |
          bash systems-infrastructure/projects/p01-linux-diagnostics/tests/smoke.sh
          bash systems-infrastructure/projects/p01-linux-diagnostics/tests/failure_cases.sh

  service-failure-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Test synthetic loopback service
        run: python3 -m unittest discover -s systems-infrastructure/projects/p03-service-failure-lab/tests -v

  powershell-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Parse Windows PowerShell diagnostic starter
        shell: pwsh
        run: ./systems-infrastructure/projects/p04-windows-infrastructure/tests/Test-Syntax.ps1

  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Test the local link checker
        run: python3 -m unittest discover -s systems-infrastructure/scripts/tests -v
      - name: Validate internal Markdown file links
        run: python3 systems-infrastructure/scripts/check_local_links.py
